version: '3.8'

services:
  suitecrm:
    build: .
    container_name: suitecrm_app
    ports:
      - '8080:80'
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
    environment:
      - DB_HOST=mysql
      - DB_USER=suitecrm
      - DB_PASSWORD=suitecrm_password
      - DB_NAME=suitecrm
    networks:
      - suitecrm_network

  mysql:
    image: mysql:8.0
    container_name: suitecrm_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: suitecrm
      MYSQL_USER: suitecrm
      MYSQL_PASSWORD: suitecrm_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - suitecrm_network
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data:

networks:
  suitecrm_network:
    driver: bridge 